name: TowSoft Mission Creator

on:
  repository_dispatch:
    types: [create-towsoft-mission]

jobs:
  create-mission:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Create TowSoft Mission
        env:
          TOWSOFT_URL:       https://verviers.towsoft.ca
          TOWSOFT_USER:      ${{ secrets.TOWSOFT_USER }}
          TOWSOFT_PASS:      ${{ secrets.TOWSOFT_PASS }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QUEUE_ID:          ${{ github.event.client_payload.queue_id }}
          PAYLOAD_DATA:      ${{ github.event.client_payload.data }}
        run: node scripts/towsoft-create.js
